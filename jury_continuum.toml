# ==============================================================================
# Jury Verdict & Promotion Rules  ·  PROFILE-INDEPENDENT
# ==============================================================================
# `weights` and `masterpiece_threshold` keep the exact shape jury_evaluator.py
# and internal/jury/jury.go already expect. Do not rename them.
#
# The path keys below are RELATIVE ON PURPOSE. pipeline_paths.load_continuum()
# joins them onto OUT_DIR and hands back absolute paths. The old
# "/root/Models/flux-output/..." literals are gone: that hardcoding is exactly
# why nothing in this repo would run anywhere but one production box.
# ==============================================================================
[verdict]
weights = { harmony = 0.35, structure = 0.35, semantic_fidelity = 0.30 }
masterpiece_threshold = 90.0
audit_log = "audit.jsonl"
masterpiece_destination = "rosarium"
mutation_feedback = true
path_base = "out_dir"

# Per-juror weighting, mirroring internal/jury/jury.go DefaultConfig(). The
# `decoder` seat is retained at its historical weight because jury.go still
# normalises over four names; the witness tenant answers for it.
[verdict.jurors]
mode = "parallel"
order = ["pixtral", "qwen", "decoder", "governor"]
adversarial_mode = true
weights = { pixtral = 0.35, qwen = 0.35, decoder = 0.15, governor = 0.15 }
strictness = { pixtral = 2.0, qwen = 1.2, decoder = 1.5, governor = 2.2 }

# Percentile tiers, as implemented in jury_evaluator.py.
[verdict.tiers]
masterpiece_percentile = 98.0
spectacle_percentile = 90.0
banal_percentile = 40.0
rolling_window = 300
