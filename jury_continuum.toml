# ==============================================================================
# Influx Vision · Mixture of Judges (MoJ) Autonomous Continuum Blueprint
# ==============================================================================
# Multi-Tenant VRAM Provisioning Budget: 140.4 GiB Total (NVIDIA H200 SXM)
# ==============================================================================

[continuum]
name = "influx-vision-moj"
version = "2.0.0"
authority = "Sovereign Council & Governor Protocol"
gpu_target = "NVIDIA H200 141GB HBM3e"
cadence_seconds = 6.3

# ------------------------------------------------------------------------------
# 1. Governor LLM Brain (Macro Reasoning & Prompt Mutation)
# ------------------------------------------------------------------------------
[tenants.governor]
model = "redhatai/gemma-4-31b-it-fp8-dynamic"
served_name = "governor"
port = 8000
gpu_memory_utilization = 0.40
max_model_len = 131072
tensor_parallel = 1
role = "Senior Protocol Advisor & Evolutionary Prompt Mutator"
vram_expected_gib = 56.0

# ------------------------------------------------------------------------------
# 2. Multimodal Feature Decoder (Visual Aggregator)
# ------------------------------------------------------------------------------
[tenants.decoder]
model = "google/gemma-4-12b-it"
served_name = "decoder-12b"
port = 8001
gpu_memory_utilization = 0.10
max_model_len = 32768
tensor_parallel = 1
role = "Feature Aggregation & Scorecard Synthesis"
vram_expected_gib = 14.0

# ------------------------------------------------------------------------------
# 3. Artistic & Palette Critic (Aesthetician)
# ------------------------------------------------------------------------------
[tenants.pixtral]
model = "mistralai/Pixtral-12B-2409"
served_name = "pixtral-critic"
port = 8002
gpu_memory_utilization = 0.10
max_model_len = 32768
tensor_parallel = 1
role = "Artistic Theory, Palette Cohesion & Medium Authenticity"
vram_expected_gib = 14.0

# ------------------------------------------------------------------------------
# 4. High-Precision Structural Inspector (Grounding & Defect Detector)
# ------------------------------------------------------------------------------
[tenants.qwen]
model = "Qwen/Qwen2.5-VL-7B-Instruct"
served_name = "qwen-inspector"
port = 8003
gpu_memory_utilization = 0.08
max_model_len = 32768
tensor_parallel = 1
role = "Spatial Grounding, Anatomy, Line Integrity & Defect Scan"
vram_expected_gib = 11.2

# ------------------------------------------------------------------------------
# 5. Generative Worker (FLUX.1-dev UDS Sieve)
# ------------------------------------------------------------------------------
[tenants.flux]
engine = "FLUX.1-dev BF16"
socket = ".fluxd/flux-gpu0.sock"
steps = 28
guidance_scale = 3.5
resolution = [1024, 1024]
role = "Continuous Flow-Matching Candidate Production"
vram_expected_gib = 35.0

# ------------------------------------------------------------------------------
# 6. High-Frequency Micro-Sensory Gates (<10ms)
# ------------------------------------------------------------------------------
[gates.sensory]
siglip_aesthetic_head = true
dinov2_semantic_novelty = true
palette_delta_evidence = true
vram_expected_gib = 2.5

# ------------------------------------------------------------------------------
# Jury Verdict & Promotion Rules
# ------------------------------------------------------------------------------
[verdict]
weights = { harmony = 0.35, structure = 0.35, semantic_fidelity = 0.30 }
masterpiece_threshold = 90.0
audit_log = "/root/Models/flux-output/audit.jsonl"
masterpiece_destination = "/root/Models/flux-output/rosarium"
mutation_feedback = true
