# ==============================================================================
# Influx Vision · Mixture of Judges (MoJ) Autonomous Continuum Blueprint
# ==============================================================================
# v3.0.0 — restructured around named [profiles.*]. Default profile is
# `rtx-pro-6000`: a SINGLE NVIDIA RTX PRO 6000 Blackwell Server Edition, 96 GB
# GDDR7, compute capability sm_120. That is the node this repo actually runs on
# (docs/BF16_NATIVE_PRECISION_SPEC.md calls it "gem2").
#
#   PROFILE                  HARDWARE                              SM       §
#   -----------------------  ------------------------------------  -------  ---
#   rtx-pro-6000  (DEFAULT)  1 x RTX PRO 6000 Blackwell, 96 GB     sm_120   V.a
#   b200                     1 x B200 SXM, 192 GB HBM3e            sm_100   V.b
#   b300                     1 x B300 SXM6, 288 GB HBM3e           sm_100   V.c
#   rtx-pro-6000-x4          4 x RTX PRO 6000, layout `balanced`   sm_120   VI
#   rtx-pro-6000-x4-dense    4 x RTX PRO 6000, layout `dense`      sm_120   VI
#   rtx-pro-6000-x4-tp       4 x RTX PRO 6000, layout `tp`         sm_120   VI
#
# The three `rtx-pro-6000-x4*` entries are three LAYOUTS of one machine. They
# are sibling profiles rather than a nested [layouts.*] table so that the schema
# stays exactly [profiles.<name>] + [profiles.<name>.tenants.<role>] everywhere.
# ARCANE_LAYOUT=balanced|dense|tp maps onto the suffix; ARCANE_PROFILE takes the
# full name.
#
# On a multi-card profile `vram_gib` is the PER-CARD figure and `fits` is
# PER-GPU. 4 x 96 GB is not a 384 GB pool and never becomes one.
#
# Read this file through pipeline_paths.load_continuum(). It resolves the active
# profile, applies each tenant's `precision` knob against its `variants.*` map,
# and turns the relative [verdict] paths into absolute paths under OUT_DIR.
# Nothing here hardcodes /root — see pipeline_paths.py for the env-var defaults.
#
# ==============================================================================
# I. SM120 IS NOT SM100. THIS IS THE MOST IMPORTANT PARAGRAPH IN THIS FILE.
# ==============================================================================
# RTX PRO 6000 Blackwell is **sm_120** (workstation Blackwell). B200 and B300 are
# **sm_100** (datacenter Blackwell). They are NOT the same kernel family:
#
#   * sm_120 issues SM80-era `mma.sync`. sm_100 issues `tcgen05.mma`. Kernels
#     authored for SM100 — DeepGEMM, upstream CUTLASS SM100 collectives, WGMMA
#     Flash Attention — fail to compile or crash at runtime on SM120.
#   * sm_120 GEMM tiles must fit **99 KB** of shared memory. sm_100 gets 228 KB.
#     Different tile shapes, different kernel implementations, full stop.
#   * Dense NVFP4 GEMM on SM120 **does** work: vLLM >= 0.13.0 ships
#     csrc/quantization/fp4/nvfp4_scaled_mm_sm120_kernels.cu.
#   * NVFP4 **MoE** kernels are BROKEN on SM120 — vllm-project/vllm#33416,
#     vllm-project/vllm#31085, flashinfer-ai/flashinfer#2577. The FlashInfer /
#     CUTLASS / DeepGEMM MoE paths are gated behind
#     `is_device_capability_family(100)`, which SM120 does not satisfy.
#
# >>> WHY THIS DOES NOT HURT US, AND WHY YOU MUST NOT "UPGRADE" PAST IT:
# >>> every model on this roster — Qwen3.8-27B, Gemma-4-31B, Pixtral-12B — is a
# >>> **DENSE** model. Dense NVFP4 is the working path on SM120. Swapping in an
# >>> MoE checkpoint (e.g. Qwen3.8-235B-A22B, or any *-A*B sparse variant) will
# >>> break this card. Every tenant below carries `dense = true`. If you ever set
# >>> it false on the rtx-pro-6000 profile, you have broken the node.
#
# >>> PROVISIONING PREREQUISITE: the R2 artifact bank advertised by `make receipt`
# >>> carries wheels/vllm/65b7662d.../sm100/ and .../sm80/ ONLY. There is **no
# >>> sm120 wheel in the bank.** The rtx-pro-6000 profile has no prebuilt vLLM
# >>> and requires vLLM >= 0.13.0 compiled for sm_120 before it can be
# >>> provisioned. provision_jury.sh checks for this and says so.
#
# ==============================================================================
# II. PRECISION POLICY — judges quantize, the generator never does
# ==============================================================================
# Quantizing a judge to 4 bits is cheap and harmless: it reads an image and
# emits a score. Quantizing the *generator* destroys exactly the fine impasto and
# brush-texture detail that the Fortiche/Arcane aesthetic rubric
# (docs/ARCANE_LATENT_CARTOGRAPHY_PROTOCOL_SPEC.md §3) exists to measure, and it
# contradicts the hard pin in docs/BF16_NATIVE_PRECISION_SPEC.md ("Quantization
# degradation (such as FP4 or INT8 compression on model weights) is explicitly
# disabled for visual diffusion transformers").
#
#   flux.precision = "bf16" in ALL THREE profiles. Non-negotiable default.
#   The `q4_k_s` variant (city96/FLUX.1-dev-gguf, flux1-dev-Q4_K_S.gguf, 6.81
#   GiB) exists ONLY as a deliberate low-VRAM escape hatch. Selecting it makes
#   pipeline_paths.vram_budget() emit a degradation warning, and it should.
#
# The precision ladder climbs with VRAM: 96 GB -> 4-bit judges; 192 GB -> FP8
# judges; 288 GB -> BF16 judges. That is the whole reason `precision` is a
# per-tenant knob with a precision -> model-id map instead of a hardcoded id.
#
# ==============================================================================
# III. MANDATORY TENANTS — operator standing order
# ==============================================================================
#   flux      always on, every profile   (the generator)
#   witness   always on, every profile   (Qwen3.8-27B; absorbs the old 12B
#                                         `decoder` seat, which no longer exists)
#   governor  always on, every profile   (local OR remote — see §V)
#   pixtral   always on, every profile   "Pixtral we keep." NOT a toggle.
#   gates     always on, every profile   DINOv2-Giant + SigLIP. NOT a toggle.
#   kontext   THE ONLY TOGGLE. Default OFF everywhere. ARCANE_KONTEXT=1.
#
# There is no ARCANE_PIXTRAL env var and there is no DINO toggle. Deliberately.
#
# ==============================================================================
# IV. PORT MAP — no collisions, verified
# ==============================================================================
#   :8000  governor  (vLLM; not bound at all when governor.remote = true)
#   :8001  witness   (vLLM)   <- matches internal/server/server.go:977
#   :8002  pixtral   (vLLM)
#   :8003  RESERVED  (deliberately unallocated — see [ports])
#   UDS    flux      .fluxd/flux-gpu0.sock     (no TCP port)
#   UDS    kontext   .fluxd/flux-kontext.sock  (no TCP port, toggle)
#   n/a    gates     in-process inside moj_evaluator.py — no server, no port
#
# v2.0.0 of this file assigned :8002 to Pixtral while provision_jury.sh launched
# the Qwen visual witness on :8002. That was a straight bind collision. Fixed.
# (docs/ARCANE_..._SPEC.md §4 shows :9000/:9001/:9002 as upstream engine ports
#  behind an :8000/:8001/:8002 gateway. These are the gateway-side ports.)
#
# ==============================================================================
# V. VRAM ARITHMETIC — all three profiles, shown long-hand
# ==============================================================================
# For a vLLM tenant, gpu_memory_utilization is a fraction of the WHOLE card, and
# vLLM reserves that whole fraction up front: weights + activations + KV cache.
# So the number that actually matters for co-tenancy is the RESERVATION:
#
#     vram_expected_gib = gpu_memory_utilization * vram_gib * tensor_parallel
#
# `weights_gib` is carried alongside so the two can be compared. Most previous
# budgets in this repo silently summed *weights* and called it a VRAM budget.
# That is why they never matched the hardware. Both totals are shown below.
#
# ------------------------------------------------------------------------------
# V.0  A NOTE ON THE SENSORY GATES: 2.5 GiB WAS WRONG. IT IS 3.0.
# ------------------------------------------------------------------------------
# v2.0.0 of this file declared `[gates.sensory] vram_expected_gib = 2.5`. That
# figure was never measured. Counted from parameters at fp16, the mandated
# DINOv2-Giant + SigLIP-base-patch16-224 pair is 2.494 GiB of WEIGHTS alone;
# with activations and the CUDA arena the resident cost is ~2.85 GiB. 2.5 does
# not fit its own contents.
#
#   config                                weights   resident   fits 2.5
#   ------------------------------------  -------   --------   --------
#   dinov2-giant + siglip-base  (MANDATE)   2.494      ~2.85      NO
#   dinov2-large + siglip-base              0.944      ~1.24      yes
#   dinov2-base  + siglip-base              0.539      ~0.82      yes
#   clip-vit-base-patch32 (degraded)        0.281      ~0.43      yes
#
# The smaller pairs are offered as `variants.fp16-large` / `fp16-base` /
# `fp16-clip` and are NEVER the default: the operator mandated DINOv2-Giant, so
# the correct response is to budget the real number, not to quietly downgrade
# the model. Every profile below therefore carries gates at 3.00 GiB, and every
# gates tenant keeps `declared_vram_expected_gib = 2.5` so the discrepancy stays
# visible instead of being papered over.
#
# ------------------------------------------------------------------------------
# V.a  rtx-pro-6000 — 96.0 GiB total, 2.0 GiB reserved, 94.0 GiB usable
# ------------------------------------------------------------------------------
#   tenant    precision  util    reservation           weights
#   --------  ---------  ------  --------------------  -------
#   flux      bf16       n/a       35.00 (fixed, UDS)   35.00   full resident
#                                                               pipeline: BF16
#                                                               DiT 23.8 + T5-XXL
#                                                               + CLIP-L + VAE
#   witness   nvfp4      0.28    0.28*96 =  26.88       24.60   KV/act  2.28
#   governor  nvfp4      0.21    0.21*96 =  20.16       19.00   KV/act  1.16
#   pixtral   w4a16      0.09    0.09*96 =   8.64        7.00   KV/act  1.64
#   gates     fp16       n/a        3.00 (measured)       2.494  see V.0
#   ----------------------------------------------------------
#   BASE reservation                        93.68 / 96.0    free  2.32
#   BASE weights-only                       88.09 / 96.0    free  7.91
#
#   The "~88 / 96" figure is the weights-only column. It omits the 5.59 GiB of
#   KV cache, activation arena and gate overhead that gets reserved on top. The
#   honest co-tenancy number is 93.68. (Gate weights are 2.494; the gate
#   RESERVATION is 3.00 — see V.0.)
#
#   kontext  governor   reservation   free    fits   headroom over reserve
#   -------  --------   -----------   -----   ----   ---------------------
#   OFF      local          93.68      2.32   YES     0.32   <-- see warning
#   ON       local         102.68     -6.68   NO     -8.68
#   OFF      remote         73.52     22.48   YES    20.48
#   ON       remote         82.52     13.48   YES    11.48
#
#   kontext ON costs 9.00 GiB MARGINAL here: Q4_K_S DiT 6.8 + ~2.2 activations.
#   Its T5/CLIP text encoders are shared with the already-resident FLUX worker,
#   so this is an increment, not a second full pipeline. BF16 Kontext costs
#   24.00 marginal and does not fit on this card under any arrangement that
#   also keeps the governor local.
#
#   >>> WARNING, and it is now a severe one. The DEFAULT posture (kontext OFF,
#   >>> governor LOCAL) clears the reserve by 0.32 GiB. That is a third of a
#   >>> gigabyte on a 96 GiB card — 0.3%. It is not a margin; it is a rounding
#   >>> error. It will boot, and it will OOM the first time a KV cache grows, a
#   >>> driver update moves the CUDA context size, or someone attaches a display.
#   >>> The gates correction in V.0 ate most of what little slack there was.
#   >>>
#   >>> For ANY unattended run on this card: ARCANE_GOVERNOR_REMOTE=1. That is
#   >>> 20.48 GiB of headroom instead of 0.32, and the governor is served at
#   >>> https://governor.influx.vision/v1 regardless. vram_budget() raises this
#   >>> automatically whenever headroom drops below 1.0 GiB.
#
#   Escape hatch if you must have Kontext on this card with a local governor:
#     ARCANE_FLUX_PRECISION=q4_k_s   ->  flux 35.00 becomes 18.00
#     (35.0 - 23.8 BF16 DiT + 6.8 Q4_K_S DiT = 18.0)  ->  total 85.68, fits with
#     8.32 GiB of headroom. It costs generator texture fidelity. It is not a
#     default. It is a knob you reach for knowing what it takes from you.
#
# ------------------------------------------------------------------------------
# V.b  b200 — 192.0 GiB total, 4.0 GiB reserved, 188.0 GiB usable
# ------------------------------------------------------------------------------
#   tenant    precision  util     reservation            weights
#   --------  ---------  -------  ---------------------  -------
#   flux      bf16       n/a         35.00 (fixed)         35.00
#   witness   fp8        0.150    0.150*192 =  28.80       27.00
#   governor  fp8        0.290    0.290*192 =  55.68       31.00
#   pixtral   fp8        0.075    0.075*192 =  14.40       12.50
#   gates     fp16       n/a          3.00 (measured)        2.494
#   -----------------------------------------------------------
#   BASE reservation                          136.88 / 192.0   free  55.12
#   BASE weights-only                         107.99 / 192.0
#
#   kontext  governor   reservation   free     fits
#   -------  --------   -----------   ------   ----
#   OFF      local         136.88      55.12   YES
#   ON       local         160.88      31.12   YES   <- BF16 Kontext fits here
#   OFF      remote         81.20     110.80   YES
#   ON       remote        105.20      86.80   YES
#
#   Note on pixtral fp8: mistralai/Pixtral-12B-2409 ships BF16 weights. vLLM
#   quantizes them online with --quantization fp8 (dynamic per-tensor). There is
#   no separate FP8 checkpoint on the Hub and we are not pretending there is.
#
# ------------------------------------------------------------------------------
# V.c  b300 — 288.0 GiB total, 6.0 GiB reserved, 282.0 GiB usable
# ------------------------------------------------------------------------------
#   tenant    precision  util    reservation            weights
#   --------  ---------  ------  ---------------------  -------
#   flux      bf16       n/a        35.00 (fixed)         35.00
#   witness   bf16       0.21    0.21*288 =   60.48       54.00   27B * 2 bytes
#   governor  fp8        0.20    0.20*288 =   57.60       31.00
#   pixtral   bf16       0.10    0.10*288 =   28.80       24.00   12B * 2 bytes
#   gates     fp16       n/a         3.00 (measured)        2.494
#   ----------------------------------------------------------
#   BASE reservation                         184.88 / 288.0   free  103.12
#   BASE weights-only                        146.49 / 288.0
#
#   kontext  governor   reservation   free     fits
#   -------  --------   -----------   ------   ----
#   OFF      local         184.88     103.12   YES
#   ON       local         208.88      79.12   YES
#   OFF      remote        127.28     160.72   YES
#   ON       remote        151.28     136.72   YES
#
#   Governor at full BF16 also fits on this card, and is offered as a variant:
#     governor bf16, util 0.24 -> 69.12 reservation (weights 31B*2 = 62.00)
#     base 196.40, with Kontext BF16 220.40 / 288.0 -> 67.60 free. Fits.
#   Default stays fp8 because 62 GiB of BF16 weights buys nothing measurable on
#   a text-only critique head. The variant is there if you want to prove it.
#
#   >>> RECONCILIATION with docs/ARCANE_LATENT_CARTOGRAPHY_PROTOCOL_SPEC.md §4,
#   >>> which claims "131+ GB Free VRAM Headroom" and a "64-Frame Batch Orbit
#   >>> Pipeline" on this node. Say it plainly: the spec was optimistic, because
#   >>> it was budgeting a SMALLER roster. Its diagram counts three subsystems —
#   >>> dual governors ~70, FLUX ~32, Pixtral ~15 = 117, leaving 171 free (the
#   >>> spec then quotes 131+, itself already conservative against its own
#   >>> figures). It counts NO visual witness and NO sensory gates. Add the
#   >>> Qwen3.8-27B witness (60.48 at BF16) and the gates (3.00) and correct the
#   >>> FLUX figure to its true 35.00, and free headroom is 103.12 with Kontext
#   >>> off, 79.12 with Kontext on. The 64-frame batch orbit must be sized
#   >>> against ~79 GiB, not 131. It still runs; it is not as roomy as advertised.
# ==============================================================================

[continuum]
name = "influx-vision-moj"
version = "3.0.0"
authority = "Sovereign Council & Governor Protocol"
default_profile = "rtx-pro-6000"
cadence_seconds = 6.3

# Beauty-protocol stream: FLUX emits N unique-seed stills; each still is judged
# uniqueness → sensory gates → witness + pixtral → governor → composite/tier.
# n and steps are closed sets so the oversight page cannot invent a third mode.
[stream]
n = [256, 512]
n_default = 256
steps = [18, 28]
steps_default = 28
guidance_scale = 3.5
resolution = [1024, 1024]
queue_depth = 2
eval_path = ["generate", "uniqueness", "sensory_gates", "witness", "pixtral", "governor", "composite"]
# Fashion lock: GPU 0 and GPU 3 commission this brief only. Celadon/arcane
# are refused at protocol_stream.py, /api/protocol, and fashion_lock.py.
prompt = "The most extravagant fashion models in the most unique and exquisite dresses ever made, of all shapes and sizes and colors, the new Fashion beauty on beauty"
prompt_fashion = "The most extravagant fashion models in the most unique and exquisite dresses ever made, of all shapes and sizes and colors, the new Fashion beauty on beauty"
prompt_arcane = "An adult stunning princess with the beauty of an Italian supermodel, acting as a character in an Arcane style hybrid animation that blends 3D character modeling with hand painted 2D effects, elegant regal costume, expressive face, consistent character identity, holding a glowing impossible procedural 3D rose as the extra element, floating crimson velvet rose petals, enchanted glass garden, the rose painted with the same visible brushwork as the character not rendered smooth, cinematic hybrid animation still, painterly 2D brushwork over sculpted 3D form, hand-painted rim light, graphic shadows, unique art beauty not generic fashion, high-end animated series frame, matte painted skin with visible strokes, no plastic CGI"
prompt_still_life = "STOPPED — celadon tea-bowl / mug stream is forbidden"
steps_fashion = 28
steps_arcane = 28
steps_still_life = 18

# Port allocation kept as data so provisioning can preflight for collisions
# instead of discovering them at bind() time.
[ports]
governor = 8000
witness = 8001
pixtral = 8002
reserved = [8003]

# The governor is the one tenant that can live off-card. `remote` is per-profile
# (see each [profiles.*.tenants.governor]); these are the endpoints it resolves
# to either way. ARCANE_GOVERNOR_REMOTE=1 forces remote on any profile.
[governor]
remote_base_url = "https://governor.influx.vision/v1"
local_base_url = "http://127.0.0.1:8000/v1"
cli = "gemstone governor chat"
served_name = "governor"

# Models that must never appear in this file again. Kept as data so a linter or
# a future agent can assert against it rather than rediscovering the history.
# Every one of these was live in v2.0.0 of this file or in provision_jury.sh.
[retired]
models = [
  "Qwen/Qwen2.5-VL-7B-Instruct",
  "Qwen/Qwen3-VL-8B-Instruct",
  "google/gemma-4-12b-it",
  "black-forest-labs/FLUX.1-schnell",
]
reason = "Stale roster. Qwen3.8-27B absorbs both the VL inspector and the 12B decoder seats; FLUX.1-schnell is not a BF16-native generator."


# ==============================================================================
# PROFILE: rtx-pro-6000  ·  DEFAULT  ·  THE ONE THAT MUST BE CORRECT
# ==============================================================================
[profiles.rtx-pro-6000]
description = "Single NVIDIA RTX PRO 6000 Blackwell Server Edition, 96 GB GDDR7"
gpu = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
sm = "sm_120"
vram_gib = 96.0
gpu_count = 1
vram_per_gpu_gib = 96.0
reserve_gib = 2.0
gpus = 1
interconnect = "none"
interconnect_verified = false
interconnect_detected = ""
tensor_parallel_viable = false
vllm_min_version = "0.13.0"
native_nvfp4_dense = true
native_nvfp4_moe = false
prebuilt_wheel_available = false
notes = "Workstation Blackwell. Dense NVFP4 only — MoE NVFP4 kernels are gated behind is_device_capability_family(100) and crash here. No sm120 wheel in the R2 artifact bank; vLLM >= 0.13.0 must be built for sm_120 first."

# --- Generative engine. BF16, hard-pinned. Not a vLLM tenant: a resident UDS
# --- worker addressed over .fluxd/flux-gpu0.sock.
[profiles.rtx-pro-6000.tenants.flux]
kind = "uds"
gpu = 0
role = "Continuous Flow-Matching Candidate Production"
model = "black-forest-labs/FLUX.1-dev"
precision = "bf16"
socket = "flux-gpu0.sock"
vram_expected_gib = 35.0
weights_gib = 35.0
enabled = true
mandatory = true
toggleable = false
dense = true
steps = 28
guidance_scale = 3.5
resolution = [1024, 1024]
variants.bf16 = { model = "black-forest-labs/FLUX.1-dev", weights_gib = 35.0, vram_expected_gib = 35.0, note = "BF16 DiT 23.8 + T5-XXL + CLIP-L + VAE + activations." }
variants.q4_k_s = { model = "city96/FLUX.1-dev-gguf", gguf_file = "flux1-dev-Q4_K_S.gguf", weights_gib = 6.81, vram_expected_gib = 18.0, degrades_generator = true, note = "LOW-VRAM ESCAPE HATCH ONLY. 35.0 - 23.8 + 6.81 = 18.0. Costs the impasto and brush-texture detail the Fortiche rubric measures." }

# --- Visual witness. Dense 27B VLM. Absorbs the retired 12B `decoder` seat.
[profiles.rtx-pro-6000.tenants.witness]
kind = "vllm"
gpu = 0
role = "Spatial Grounding, Anatomy, Line Integrity, Defect Scan & Scorecard Synthesis"
model = "unsloth/Qwen3.8-27B-NVFP4"
precision = "nvfp4"
port = 8001
served_name = "visual-witness"
gpu_memory_utilization = 0.28
vram_expected_gib = 26.88
weights_gib = 24.6
enabled = true
mandatory = true
toggleable = false
dense = true
max_model_len = 32768
kv_cache_dtype = "fp8"
tensor_parallel = 1
variants.nvfp4 = { model = "unsloth/Qwen3.8-27B-NVFP4", weights_gib = 24.6, gpu_memory_utilization = 0.28, note = "Dense NVFP4 GEMM via nvfp4_scaled_mm_sm120_kernels.cu. ~30-34% faster decode than BF16. vLLM only, no SGLang." }
variants.fp8 = { model = "Qwen/Qwen3.8-27B-FP8", weights_gib = 27.0, gpu_memory_utilization = 0.30, note = "Portable fallback, fine-grained block-128 FP8." }
variants.bf16 = { model = "Qwen/Qwen3.8-27B", weights_gib = 54.0, gpu_memory_utilization = 0.60, note = "Does not co-tenant on 96 GiB. Present for profile parity only." }

