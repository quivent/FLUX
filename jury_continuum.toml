# ==============================================================================
# VI. PROFILE FAMILY: rtx-pro-6000-x4 · FOUR RTX PRO 6000 BLACKWELL, 96 GB EACH
# ==============================================================================
# Three layouts of one machine, expressed as three sibling profiles so the
# schema stays exactly [profiles.<name>] + [profiles.<name>.tenants.<role>]:
#
#     rtx-pro-6000-x4          balanced  (default)  3 generators + 1 judge card
#     rtx-pro-6000-x4-dense    dense                4 generators, judges squeezed
#     rtx-pro-6000-x4-tp       tp                   2 generators + TP judge stack
#
# ARCANE_LAYOUT=balanced|dense|tp selects between them; ARCANE_PROFILE takes the
# full name. pipeline_paths.active_profile() does the suffix mapping.
#
# ------------------------------------------------------------------------------
# INTERCONNECT — DECLARED nvlink, NOT VERIFIED. DETECT, DO NOT ASSUME.
# ------------------------------------------------------------------------------
# NVIDIA's published specification for RTX PRO 6000 Blackwell states NO NVLink;
# the operator reports NVLink present on this actual four-card box. Both claims
# are recorded here and NEITHER is hardcoded as truth:
#
#     interconnect          = "nvlink"   <- DECLARED / expected
#     interconnect_verified = false      <- provisioning flips this
#     interconnect_detected = ""         <- provisioning fills this in
#
# provision_jury.sh probes `nvidia-smi nvlink --status` and `nvidia-smi topo -m`
# and warns loudly when the detected topology disagrees with the declaration.
# `flux arcane provision` does the same. If detection comes back PCIe-only, any
# tenant with tensor_parallel > 1 is a MISCONFIGURATION and must be reported as
# one, never silently run: TP puts full weight tensors on the wire, and PCIe
# Gen5 x16 moves ~64 GB/s against NVLink's ~900 GB/s. That is a 14x gap, and it
# turns a TP judge stack from a latency win into a latency trap.
#
# What NVLink does and does not buy here:
#   * It does NOT create a 384 GB pool. `fits` is PER-GPU in every layout below,
#     and stays per-GPU. TP changes what can SPAN cards; it does not let one
#     card hold more than 96 GB.
#   * Nothing on this roster NEEDS TP for capacity. FLUX BF16 35.0,
#     Qwen3.8-27B BF16 54.0, Gemma-4-31B BF16 62.0, Pixtral BF16 24.0 — every
#     one fits a single card. TP buys LATENCY and future headroom, nothing else.
#     The `tp` layout exists to make that tradeoff explicit, not to be the
#     default.
#   * Without NVLink the right model is SHARD / DATA parallelism, which this
#     repo already implements and the Arcane pipeline simply never used:
#       internal/fleet/fleet.go     Pool, DetectGPUs(), NewForGPUs(),
#                                   SubmitAtlas() shard fan-out, Idlest(),
#                                   ShardBlock()
#       internal/daemon/daemon.go   per-GPU sockets flux-gpu0.sock,
#                                   flux-gpu1.sock, ... with auto-discovery (~L47)
#       worker.py                   disjoint sharding via shard_id / shard_total /
#                                   shard_block, per-shard progress files
#                                   progress.shard{N}.json, staggered shard
#                                   phasing (~L1677) against a thundering herd
#       Each worker gets FLUX_WORKER_GPU / CUDA_VISIBLE_DEVICES and therefore
#       sees itself as cuda:0 (worker.py ~L774).
#     That is why the generator tenants below carry shard_id / shard_total and a
#     per-GPU socket rather than a tensor_parallel setting.
#
# ------------------------------------------------------------------------------
# UNCHANGED BY NVLINK
# ------------------------------------------------------------------------------
# sm_120 NVFP4 MoE kernels are still broken (vllm#33416, vllm#31085,
# flashinfer#2577). That is a kernel-family issue and has nothing to do with the
# interconnect. Every tenant stays dense = true. The generator stays BF16.
# The sensory gates are 3.00 GiB, measured — see §V.0.
#
# ==============================================================================
# ARITHMETIC · LAYOUT 1 · balanced (DEFAULT)   per card: 96.0 total, 2.0 reserved,
#                                              94.0 usable
# ==============================================================================
#   gpu  tenants                                      reservation   usable  head
#   ---  -------------------------------------------  -----------   ------  -----
#    0   flux bf16 35.00 (shard 0/3)                        62.00     94.0  32.00
#        + gates 3.00 + kontext bf16 24.00
#    1   flux bf16 35.00 (shard 1/3)                        73.40     94.0  20.60
#        + governor fp8 0.40*96 = 38.40
#    2   flux bf16 35.00 (shard 2/3)                        35.00     94.0  59.00
#    3   witness bf16  0.62*96 = 59.52                      86.40     94.0   7.60
#        + pixtral bf16 0.28*96 = 26.88
#   ------------------------------------------------------------------------
#   AGGREGATE                                256.80 / 384.0    free 127.20
#
#   Why the judges split 2 + 1 instead of all landing on GPU3:
#     GPU3's 94.0 GiB is consumed by the two VISION judges at full BF16
#     (59.52 + 26.88 = 86.40). The governor is the only judge that never looks
#     at an image — it is a text critic and a prompt mutator — so it is the one
#     that can sit on a generator card without competing for memory bandwidth
#     during a contact-sheet pass. It goes to GPU1 at FP8 rather than BF16
#     because 62 GiB of BF16 weights buys nothing measurable on a text critique
#     head, and BF16 there (util 0.61 = 58.56) would leave GPU1 with 0.44 GiB.
#     GPU2 is deliberately left as a pure generator with 59.00 GiB spare: it is
#     the expansion card, and the one that absorbs a second Kontext instance or
#     a grown KV cache without a re-plan.
#
#   Kontext defaults ON here — the first profile where it is free. GPU0 holds it
#   at full BF16 (24.00 marginal over the shared text encoders) and still clears
#   the reserve by 32.00 GiB.
#
#   Throughput: three concurrent FLUX workers on disjoint atlas shards, ~3x the
#   single-card atlas rate, with judges that never stall generation.
#
# ==============================================================================
# ARITHMETIC · LAYOUT 2 · dense   (4 generators, judges squeezed alongside)
# ==============================================================================
#   gpu  tenants                                      reservation   usable  head
#   ---  -------------------------------------------  -----------   ------  -----
#    0   flux bf16 35.00 (shard 0/4) + gates 3.00           38.00     94.0  56.00
#    1   flux bf16 35.00 (shard 1/4)                        63.80     94.0  30.20
#        + witness fp8 0.30*96 = 28.80
#    2   flux bf16 35.00 (shard 2/4)                        73.40     94.0  20.60
#        + governor fp8 0.40*96 = 38.40
#    3   flux bf16 35.00 (shard 3/4)                        73.40     94.0  20.60
#        + pixtral fp8 0.15*96 = 14.40 + kontext bf16 24.00
#   ------------------------------------------------------------------------
#   AGGREGATE                                248.60 / 384.0    free 135.40
#
#   THE HONEST TRADEOFF: dense buys a fourth generator (~4x atlas rate) and pays
#   for it TWICE. First in judge precision — every judge drops from BF16 to FP8,
#   because a card holding a 35 GiB generator has only 59.0 GiB left. Second in
#   judge LATENCY: on GPUs 1-3 a judge's forward pass now contends with an
#   active denoise loop for SM time and memory bandwidth, so verdict latency
#   becomes a function of how busy the generators are. Balanced keeps judging
#   off the critical path; dense does not. Choose dense when you are producing
#   for volume and can tolerate lumpy verdict latency.
#
# ==============================================================================
# ARITHMETIC · LAYOUT 3 · tp   (tensor-parallel judge stack, full BF16)
# ==============================================================================
# A TP tenant reserves util * 96 on EVERY card it spans, so per-card cost is
# util*96 and aggregate is util*96*tp.
#
#   gpu    tenants                                    reservation   usable  head
#   -----  -----------------------------------------  -----------   ------  -----
#    0     flux bf16 35.00 (shard 0/2)                      62.00     94.0  32.00
#          + gates 3.00 + kontext bf16 24.00
#    1     flux bf16 35.00 (shard 1/2)                      35.00     94.0  59.00
#    2,3   witness  bf16 tp=2  0.32*96 = 30.72/card         80.64     94.0  13.36
#          governor bf16 tp=2  0.36*96 = 34.56/card       (each of
#          pixtral  bf16 tp=2  0.16*96 = 15.36/card        gpu2, gpu3)
#   ------------------------------------------------------------------------
#   per-card on gpu2 = 30.72 + 34.56 + 15.36 = 80.64
#   per-card on gpu3 = 30.72 + 34.56 + 15.36 = 80.64
#   judge aggregate  = 61.44 + 69.12 + 30.72 = 161.28
#   AGGREGATE        = 62.00 + 35.00 + 80.64 + 80.64 = 258.28 / 384.0
#                                                       free 125.72
#
#   WHAT IT COSTS: one generator card. Two FLUX shards instead of three, so
#   roughly 2/3 the atlas throughput of `balanced`.
#   WHAT IT BUYS:  all three judges at full BF16 at the same time — `balanced`
#   can only afford BF16 for the two vision judges and pushes the governor to
#   FP8 — plus roughly halved per-request judge latency, since each judge's
#   compute is split across two cards.
#   WHAT IT REQUIRES: real, verified NVLink. Over PCIe Gen5 x16 this layout is
#   strictly worse than `balanced` on every axis. Do not select it until
#   `nvidia-smi nvlink --status` says so.
# ==============================================================================

