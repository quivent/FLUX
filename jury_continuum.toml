weights_gib = 19.0
enabled = true
mandatory = true
toggleable = false
dense = true
remote = false
remote_base_url = "https://governor.influx.vision/v1"
max_model_len = 32768
kv_cache_dtype = "fp8"
tensor_parallel = 1
variants.nvfp4 = { model = "nvidia/Gemma-4-31B-IT-NVFP4", weights_gib = 19.0, gpu_memory_utilization = 0.21, note = "Blackwell-native dense NVFP4." }
variants.w4a16 = { model = "google/gemma-4-31B-it-qat-q4_0-gguf", weights_gib = 18.5, gpu_memory_utilization = 0.22, note = "Official QAT — quantization-aware trained, not post-hoc. Best quality per bit of the 4-bit options." }
variants.awq = { model = "QuantTrio/gemma-4-31B-it-AWQ", weights_gib = 18.5, gpu_memory_utilization = 0.22 }
variants.fp8 = { model = "redhatai/gemma-4-31b-it-fp8-dynamic", weights_gib = 31.0, gpu_memory_utilization = 0.40, note = "0.40*96 = 38.4 GiB reservation. Does NOT co-tenant with BF16 FLUX + witness on this card. SXM profiles only." }

# --- Palette critic. MANDATORY in every profile. Operator: "Pixtral we keep."
[profiles.rtx-pro-6000.tenants.pixtral]
