<!doctype html>

  <title>Governor · FLUX Motion Atlas</title>
  <link rel="stylesheet" href="/motion-atlas/topbar.css?v=1785242078">
  
  <link rel="stylesheet" href="/motion-atlas/governor.css?v=1785242078">

</head>
<body class="motionGovernor">
  
  
  
  <div id="app"></div>

  
  <script type="module" src="/motion-atlas/governor.js?v=1785242078"></script>

  <script>
  (function(){
    var sigil=document.querySelector('.atlasSigil');
    if(!sigil)return;
    try{
      var es=new EventSource('/api/jobs/events');
      es.addEventListener('jobs',function(e){
        try{
          var data=JSON.parse(e.data);
          var jobs=(data.jobs||data||[]);
          var active=jobs.some(function(j){return j.status==='running'||j.status==='queued'});
          sigil.classList.toggle('active',active);
        }catch{}
      });
    }catch{}
  })();
  </script>
</body>
</html>
