<!doctype html>
<html lang="en">
<head>
  <!-- build:{{ build_stamp }} -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b0e">
  <title>{% block title %}FLUX Motion Atlas Sphere{% endblock %}</title>
  <link rel="stylesheet" href="/motion-atlas/topbar.css?v={{ build_stamp }}">
  {% block head %}{% endblock %}
</head>
<body{% if body_class %} class="{{ body_class }}"{% endif %}>
  {% block pre_header %}{% endblock %}
  {% if not skip_header %}
  <header class="atlasTopbar">
    <a class="atlasIdentity" href="/motion-atlas/">
      <span class="atlasSigil">F</span>
      <b>FLUX <small>MOTION ATLAS SPHERE</small></b>
    </a>
    <nav class="atlasTabs">
      <a{% if page == 'atlas' %} class="active"{% endif %} href="/motion-atlas/">ATLAS</a>
      <a{% if page == 'optics' %} class="active"{% endif %} href="/motion-atlas/optics.html">OPTICS</a>
      <a{% if page == 'queue' %} class="active"{% endif %} href="/motion-atlas/queue.html">QUEUE</a>
      <a{% if page == 'registry' %} class="active"{% endif %} href="/motion-atlas/registry.html">GALLERY</a>
      <a{% if page == 'governor' %} class="active"{% endif %} href="/motion-atlas/governor.html">GOVERNOR</a>
      <a{% if page == 'visionary' %} class="active"{% endif %} href="/motion-atlas/visionary.html">VISIONARY</a>
        <a{% if page == 'visionary' %} class="active"{% endif %} href="/motion-atlas/processing.html">PROCESSING</a>
    </nav>
    <div class="atlasStatus">{% block status %}{% endblock %}</div>
  </header>
  {% endif %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script>
  (function(){
    var sigil=document.querySelector('.atlasSigil');
    if(!sigil)return;
    try{
      var url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/jobs/ws';
      var retries=0;
      (function connect(){
        var ws=new WebSocket(url);
        ws.onopen=function(){retries=0};
        ws.onmessage=function(e){
          try{
            var data=JSON.parse(e.data);
            var jobs=(data.jobs||data||[]);
            var active=jobs.some(function(j){return j.status==='running'||j.status==='queued'});
            sigil.classList.toggle('active',active);
          }catch{}
        };
        ws.onerror=function(){ws.close()};
        ws.onclose=function(){
          var delay=Math.min(1000*Math.pow(2,retries),10000)+Math.random()*300;
          retries++;
          setTimeout(connect,delay);
        };
      })();
    }catch{}
  })();
  </script>
</body>
</html>
