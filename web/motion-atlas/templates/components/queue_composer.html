{# Queue — study composer panel #}
<aside class="queueComposer">
  <div class="panelHead"><span>03</span><h2>Prepopulate study</h2></div>
  <form id="queueForm">
    <label>Study name<input id="queueName" required placeholder="atlas-sphere-study"></label>
    <label>Prompt<textarea id="queuePrompt" required placeholder="Describe the visual study"></textarea></label>
    <div class="queueFields">
      <label>Study type<select id="queueStudyType" required><option value="">Choose…</option><option value="loop">Loop</option><option value="atlas">Atlas</option></select></label>
      <label>Cells<input id="queueCells" type="number" min="1" max="65536" value="64"></label>
      <label>Size<select id="queueSize"><option>512</option><option>768</option><option>1024</option></select></label>
      <label>Steps<input id="queueSteps" type="number" min="1" max="120" value="36"></label>
      <label>Guidance<input id="queueGuidance" type="number" min=".1" max="20" step=".1" value="4.4"></label>
      <label>Seed<input id="queueSeed" value="random"></label>
      <label>Mode<select id="queueMode"><option>elliptic</option><option>omega</option><option>sway</option><option>oscillatory</option></select></label>
    </div>
    <button class="primary queueAdd" type="submit"><span>Add study</span><span>→</span></button>
  </form>
</aside>
