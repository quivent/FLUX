<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>Scores — Tea</title>
<link rel="stylesheet" href="/tea/tea.css">
<script src="/tea/tea-shell.js"></script>
<style>
  .score-hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 32px; }
  .score-hero div { border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; background: var(--card-bg); }
  .score-hero b { display: block; font: 400 36px/1 var(--serif); }
  .score-hero span { font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin: 12px 0 40px; }
  .wall a { display: block; aspect-ratio: 1; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: var(--paper-subtle); position: relative; }
  .wall img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wall i { position: absolute; left: 10px; bottom: 10px; font: 14px var(--mono); color: #f7f3ea; background: rgba(39,35,31,.72); padding: 3px 9px; border-radius: 999px; font-style: normal; }
  .rows { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 110px 140px 1fr; gap: 14px; padding: 14px 18px; background: var(--paper-soft); font: 15px/1.45 var(--mono); }
  .row b { font-family: var(--serif); font-size: 24px; font-weight: 400; }
  h2 { font: 400 40px/1 var(--serif); margin: 32px 0 16px; }
  @media (max-width: 720px) { .score-hero { grid-template-columns: 1fr 1fr; } .row { grid-template-columns: 70px 1fr; } }
</style>
</head>
<body class="tea-app">
<header class="tea-chrome">
  <a class="tea-brand" href="/"><span class="tea-seal">茶</span><span class="tea-word">Tea</span></a>
  <nav class="tea-nav" aria-label="Tea">
    <a href="/gallery/">Gallery</a>
    <a href="/jury">Jury</a>
    <a href="/judge">Judge</a>
    <a href="/desk">Desk</a>
    <a href="/governor">Governor</a>
    <a href="/train">Train</a>
    <a href="/daemons">Daemons</a>
    <a href="/scores">Scores</a>
    <a href="/movement">Movement</a>
    <a href="/studies">Studies</a>
  </nav>
</header>
<main class="desk">
  <div class="kicker">Verdicts</div>
  <h1>Scores</h1>
  <p class="lede">What the jury actually wrote. Spectacles first, then the recent audit window for each lane.</p>
  <div class="desk-lanes">
    <button class="on" data-lane="fashion">Fashion</button>
    <button data-lane="arcane">Arcane</button>
  </div>
  <div class="desk-status" id="desk-status">loading…</div>
  <div class="score-hero" id="hero"></div>
  <h2>Spectacles</h2>
  <div class="wall" id="wall"></div>
  <h2>Recent window</h2>
  <div class="rows" id="rows"></div>
</main>
<script src="/tea/desk.js"></script>
<script>
  const D = TeaDesk;
  let data = null;
  function esc(s){ return String(s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function paint() {
    const lane = D.getLane();
    const pack = (data && data[lane]) || {};
    const a = pack.audit || {};
    const specs = pack.spectacles || [];
    D.$("hero").innerHTML =
      '<div><b>' + (a.scored||0) + '</b><span>scored</span></div>' +
      '<div><b>' + (a.unscored||0) + '</b><span>unscored</span></div>' +
      '<div><b>' + (a.spectacles||0) + '</b><span>spectacles</span></div>' +
      '<div><b>' + (a.mean_raw ? Number(a.mean_raw).toFixed(1) : "—") + '</b><span>mean composite</span></div>';
    D.$("wall").innerHTML = specs.map(s => {
      const url = s.image_url || "";
      const thumb = url ? "/api/asset/thumbnail?w=384&src=" + encodeURIComponent(url) : "";
      return '<a href="' + esc(url) + '" target="_blank"><img src="' + thumb + '" alt=""><i>' + Number(s.composite_score||0).toFixed(1) + '</i></a>';
    }).join("") || '<p class="lede">No spectacles yet on this lane.</p>';
    const frames = (a.frames || []).slice().reverse();
    D.$("rows").innerHTML = frames.map(f => {
      const seats = (f.scores || []).map(x => (x.role||"?") + " " + Number(x.score||0).toFixed(1)).join(" · ");
      return '<div class="row"><b>' + (f.raw_composite != null ? Number(f.raw_composite).toFixed(1) : "—") + '</b><span>' + esc(f.tier||"—") + '</span><span>' + esc(seats || f.job_id || "") + '</span></div>';
    }).join("") || '<div class="row"><span>No audit yet.</span></div>';
    D.status(lane + " · " + (a.window||0) + " in window", "ok");
  }
  async function load() {
    const r = await fetch("/api/tea/scores", { cache: "no-store" });
    data = await r.json();
    paint();
  }
  D.bindLanes(paint);
  load().catch(e => D.status(String(e), "bad"));
</script>
</body>
</html>
