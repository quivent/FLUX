<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/tea/tea.css">
<script src="/tea/tea-shell.js"></script>
<title>Output reports — Convergence</title>
<style>
  a { color: inherit; text-decoration: none; }
  main { max-width: 1280px; margin: 0 auto; padding: 36px clamp(16px, 3vw, 40px) 80px; }
  .kicker { font: 10px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--tea); }
  h1 { font: 400 clamp(36px, 6vw, 72px)/.9 var(--serif); letter-spacing: -.05em; margin: 8px 0 10px; }
  .lede { color: var(--soft); max-width: 46rem; font: 400 17px/1.6 var(--serif); }
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
  .lane { border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: var(--card-bg); }
  .lane h2 { margin: 0 0 6px; font: 400 28px/1.1 var(--serif); }
  .meta { font: 11px/1.4 var(--mono); color: var(--faint); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin: 14px 0; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--paper-soft); }
  .stat b { display: block; font: 400 22px/1 var(--serif); }
  .stat span { font: 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .stat.warn b { color: var(--gold); }
  .stat.ok b { color: var(--matcha); }
  .prompt { font: 12px/1.5 var(--mono); color: var(--ink); background: var(--paper-subtle); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 8em; overflow: auto; white-space: pre-wrap; }
  .thumbs { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 12px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-subtle); }
  .frames { margin-top: 12px; font: 11px/1.45 var(--mono); color: var(--soft); }
  .frames div { border-top: 1px solid var(--line); padding: 6px 0; }
  @media (max-width: 900px) { .lanes, .stats, .thumbs { grid-template-columns: 1fr 1fr; } }
</style>
<header class="tea-chrome">
  <a class="tea-brand" href="/"><span class="tea-seal">茶</span><span class="tea-word">Tea</span></a>
  <nav class="tea-nav" aria-label="Tea">
    <a href="/gallery/">Gallery</a>
    <a href="/jury">Jury</a>
    <a href="/judge">Judge</a>
    <a href="/desk">Desk</a>
    <a href="/scores">Scores</a>
    <a href="/movement">Movement</a>
    <a href="/studies">Studies</a>
  </nav>
</header>

<main>
  <div class="kicker">output reports · fashion · arcane</div>
  <h1>Output reports</h1>
  <p class="lede">Live stream posture and jury audit for the two independent studies. Fashion stays on GPU 3. Arcane stays on GPU 0.</p>
  <div class="lanes" id="lanes"><div class="meta">Loading reports…</div></div>
</main>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const thumb = (url) => '/api/asset/thumbnail?w=384&src=' + encodeURIComponent(url);
  function stat(label, value, warn) {
    return '<div class="stat' + (warn ? ' warn' : (value ? ' ok' : '')) + '"><b>' + esc(value ?? '—') + '</b><span>' + esc(label) + '</span></div>';
  }
  function laneCard(l) {
    const s = l.stream || {}, a = l.audit || {};
    const thumbs = (l.images || []).slice(0, 8).map(im => '<a href="' + esc(im.path) + '" target="_blank"><img src="' + thumb(im.path) + '" alt=""></a>').join('');
    const frames = (a.frames || []).slice(-8).reverse().map(f => {
      const score = f.raw_composite != null ? Number(f.raw_composite).toFixed(1) : '—';
      return '<div><b>' + esc(score) + '</b> · ' + esc(f.tier || '—') + ' · ' + esc(f.job_id || '') + '</div>';
    }).join('');
    return '<article class="lane">' +
      '<h2>' + esc(l.id) + '</h2>' +
      '<div class="meta">' + esc(l.worker) + ' · ' + esc(s.status || '—') + ' · ' + esc(s.prompt_version || '') +
      ' · <a href="' + esc(l.collection) + '">collection</a></div>' +
      '<div class="stats">' +
        stat('done', (s.done ?? '—') + '/' + (s.n ?? '—')) +
        stat('scored /24', a.scored, false) +
        stat('unscored /24', a.unscored, !!a.unscored) +
        stat('spectacles', a.spectacles) +
      '</div>' +
      '<p class="prompt">' + esc(s.prompt || s.error || 'no live prompt') + '</p>' +
      '<div class="thumbs">' + (thumbs || '<div class="meta">no frames yet</div>') + '</div>' +
      '<div class="frames">' + (frames || '<div>no audit rows in window</div>') + '</div>' +
    '</article>';
  }
  async function load() {
    try {
      const r = await fetch('/api/reports', { cache: 'no-store' });
      const d = await r.json();
      document.getElementById('lanes').innerHTML = (d.lanes || []).map(laneCard).join('') || '<div class="meta">no lanes</div>';
    } catch (err) {
      document.getElementById('lanes').innerHTML = '<div class="meta">reports unavailable: ' + esc(err.message) + '</div>';
    }
  }
  load();
  setInterval(load, 8000);
</script>
