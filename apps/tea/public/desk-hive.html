<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>Hive mix — Desk</title>
<link rel="stylesheet" href="/tea/tea.css">
<script src="/tea/tea-shell.js"></script>
</head>
<body class="tea-app">
<header class="tea-chrome">
  <a class="tea-brand" href="/"><span class="tea-seal">茶</span><span class="tea-word">Tea</span></a>
  <nav class="tea-nav" aria-label="Tea">
    <a href="/gallery/">Gallery</a>
    <a href="/jury">Jury</a>
    <a href="/judge">Judge</a>
    <a href="/desk">Desk</a>
    <a href="/scores">Scores</a>
    <a href="/movement">Movement</a>
    <a href="/studies">Studies</a>
  </nav>
</header>
<main class="desk">
  <div class="kicker"><a href="/desk">Desk</a> · hive</div>
  <h1>Hive mix</h1>
  <p class="lede">Share of the composite each seat is allowed. Moving a meter writes the jury weights immediately.</p>
  <div class="desk-lanes">
    <button class="on" data-lane="fashion">Fashion · GPU 3</button>
    <button data-lane="arcane">Arcane · GPU 0</button>
  </div>
  <div class="desk-status" id="desk-status">loading…</div>
  <div class="stack" id="meters"></div>
  <div class="stack" style="margin-top:16px">
    <label class="toggle"><input type="checkbox" id="en-pixtral"> Beauty seat live (pixtral / hive)</label>
    <label class="toggle"><input type="checkbox" id="en-witness"> Structure seat live (witness)</label>
    <label class="toggle"><input type="checkbox" id="en-governor"> Governor seat live</label>
  </div>
</main>
<script src="/tea/desk.js"></script>
<script>
  const D = TeaDesk;
  const KEYS = [
    { key: "pixtral", title: "Beauty", hint: "Pixtral / hive-research — color, mood, medium." },
    { key: "qwen", title: "Structure", hint: "Witness — anatomy, contour, geometry." },
    { key: "decoder", title: "Decoder", hint: "Rides with structure. Consensus grain." },
    { key: "governor", title: "Governor", hint: "Law, prompt, what must not pass." }
  ];
  let hive = {};
  function draw() {
    D.$("meters").innerHTML = KEYS.map(k => {
      const pct = Math.round((hive[k.key] || 0) * 100);
      return '<div class="meter"><div class="top"><h3>' + k.title + '</h3><span class="val" id="v-' + k.key + '">' + pct + '%</span></div>'
        + '<input type="range" min="0" max="100" value="' + pct + '" id="m-' + k.key + '">'
        + '<div class="hint">' + k.hint + '</div></div>';
    }).join("");
    KEYS.forEach(k => {
      D.$("m-" + k.key).oninput = () => { hive[k.key] = D.$("m-" + k.key).value / 100; D.$("v-" + k.key).textContent = D.$("m-" + k.key).value + "%"; push(); };
    });
    ["pixtral","witness","governor"].forEach(id => {
      D.$("en-" + id).onchange = push;
    });
  }
  const push = D.debounce(() => {
    D.save({ hive: {
      pixtral: +hive.pixtral || 0, qwen: +hive.qwen || 0, decoder: +hive.decoder || 0, governor: +hive.governor || 0,
      enable_pixtral: D.$("en-pixtral").checked,
      enable_witness: D.$("en-witness").checked,
      enable_governor: D.$("en-governor").checked
    }});
  }, 160);
  async function paint() {
    const d = await D.load();
    hive = d.desk.hive;
    D.$("en-pixtral").checked = !!hive.enable_pixtral;
    D.$("en-witness").checked = !!hive.enable_witness;
    D.$("en-governor").checked = !!hive.enable_governor;
    draw();
    D.status((d.hive && d.hive.live ? "hive live" : "hive down") + " · " + D.getLane(), d.hive && d.hive.live ? "ok" : "");
  }
  D.bindLanes(paint);
  paint().catch(e => D.status(String(e), "bad"));
</script>
</body>
</html>
