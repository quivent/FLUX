<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d0c">
  <title>Rig Observatory · Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--night:#0b0d0c;--panel:#121613;--panel2:#171c18;--ink:#f0eadc;--muted:#918f84;--line:#30362f;--green:#9cc6a4;--gold:#d7ad62;--hot:#d86f56;--mono:"IBM Plex Mono",monospace;--serif:"Cormorant Garamond",serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--mono);background:radial-gradient(circle at 80% -10%,#273127 0,transparent 34rem),linear-gradient(140deg,#0b0d0c,#10130f 60%,#090b0a)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 39px,#899183 40px),repeating-linear-gradient(0deg,transparent 0,transparent 39px,#899183 40px)}
    main{position:relative;max-width:1680px;margin:auto;padding:30px 34px 70px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:34px;border-bottom:1px solid var(--line);padding-bottom:22px}
    .eyebrow,.label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}h1{font:600 clamp(42px,6vw,82px)/.84 var(--serif);margin:9px 0 0;letter-spacing:-.025em}.status{text-align:right;color:var(--muted);font-size:11px}.status b{display:block;color:var(--green);font-weight:500;margin-bottom:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:8px}
    .summary{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px}.metric{background:rgba(15,18,15,.94);padding:15px 18px}.metric strong{display:block;font:600 29px var(--serif);color:var(--ink)}.metric span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.14em}
    .placement{display:flex;align-items:center;justify-content:space-between;gap:18px;border:1px solid var(--line);background:rgba(16,20,17,.82);padding:12px 16px;margin-bottom:22px;font-size:10px;color:var(--muted)}.placement strong{color:var(--ink);font-weight:500}.model-check{display:flex;align-items:center;gap:9px;white-space:nowrap}.model-check .dot.absent{background:var(--hot);box-shadow:0 0 10px rgba(216,111,86,.5)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.gpu{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(24,29,25,.98),rgba(13,16,14,.98));border:1px solid var(--line);min-height:410px;padding:23px;box-shadow:0 18px 60px rgba(0,0,0,.24)}.gpu:after{content:attr(data-index);position:absolute;right:-5px;top:-35px;font:700 150px var(--serif);color:rgba(255,255,255,.025);pointer-events:none}
    .gpu-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.gpu-title{font:600 32px var(--serif)}.gpu-name{font-size:10px;color:var(--muted);margin-top:3px}.badge{border:1px solid var(--line);padding:6px 9px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.badge.live{color:var(--green);border-color:#45604a}
    .gauges{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:22px}.gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}.gauge-top b{font:600 26px var(--serif)}.gauge-top span{font-size:9px;color:var(--muted);text-transform:uppercase}.track{height:4px;background:#292e29}.fill{height:100%;background:linear-gradient(90deg,var(--green),#d5d09b);transition:width .7s}.fill.hot{background:linear-gradient(90deg,var(--gold),var(--hot))}
    .facts{display:flex;gap:18px;padding:10px 0 18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px}.facts b{color:var(--ink);font-weight:500}.section{margin-top:18px}.section-title{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}.proc,.task{position:relative;border-left:2px solid #56645a;background:rgba(255,255,255,.025);padding:10px 12px;margin-top:7px}.proc-top{display:flex;gap:8px;justify-content:space-between}.proc strong{font:600 17px var(--serif)}.pid{font-size:9px;color:var(--muted)}.task-name{font-size:10px;color:var(--green);margin-top:3px}.command,.prompt{font-size:9px;line-height:1.45;color:var(--muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#666c65;font-size:10px;padding:8px 0}.error{color:var(--hot)}
    @media(max-width:1100px){.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){main{padding:22px 16px 50px}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.placement{align-items:flex-start;flex-direction:column}header{align-items:start;flex-direction:column}.status{text-align:left}.gpu{min-height:0}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Tea / Systems</div><h1>Rig Observatory</h1></div><div class="status"><b id="health"><span class="dot"></span>CONTACTING THE FOUR SEATS</b><span id="stamp">Live telemetry</span></div></header>
  <section class="summary"><div class="metric"><strong id="gpuCount">—</strong><span>GPU seats</span></div><div class="metric"><strong id="avgCompute">—</strong><span>aggregate compute</span></div><div class="metric"><strong id="freeVram">—</strong><span>VRAM available</span></div><div class="metric"><strong id="bestSeat">—</strong><span>best placement</span></div><div class="metric"><strong id="freeRam">—</strong><span>RAM available</span></div><div class="metric"><strong id="freeDisk">—</strong><span>disk available</span></div></section>
  <aside class="placement"><div id="placementText">Calculating model placement headroom…</div><div class="model-check"><span class="dot absent" id="knotDot"></span><strong id="knotStatus">Knotext: checking</strong></div></aside>
  <section class="grid" id="grid"></section>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gib=m=>(Number(m||0)/1024).toFixed(1)+' GiB';
const bytesGiB=b=>(Number(b||0)/1073741824).toFixed(0)+' GiB';
function fitLabel(mib){const g=mib/1024;if(g>=48)return 'large tenant fits';if(g>=24)return 'medium tenant fits';if(g>=12)return 'small tenant fits';return 'no safe model headroom'}
function gpuCard(g){const memPct=g.memory_total_mib?g.memory_used_mib/g.memory_total_mib*100:0;const worker=g.worker||{};const procs=(g.processes||[]).map(p=>`<div class="proc"><div class="proc-top"><strong>${esc(p.suite)}</strong><span class="pid">PID ${p.pid} · ${gib(p.memory_mib)}</span></div><div class="task-name">${esc(p.task)}</div><div class="command" title="${esc(p.command)}">${esc(p.command||p.name)}</div></div>`).join('')||'<div class="empty">No resident CUDA process</div>';const tasks=(g.tasks||[]).map(t=>`<div class="task"><div class="proc-top"><strong>${esc(t.status)} · ${esc(t.phase||'waiting')}</strong><span class="pid">${esc(t.step||0)} / ${esc(t.total_steps||0)}</span></div><div class="prompt" title="${esc(t.prompt)}">${esc(t.prompt||t.filename||t.id)}</div></div>`).join('')||'<div class="empty">No active or queued FLUX task</div>';return `<article class="gpu" data-index="${g.index}"><div class="gpu-head"><div><div class="gpu-title">GPU ${g.index}</div><div class="gpu-name">${esc(g.name)}</div></div><span class="badge ${worker.up?'live':''}">${worker.up?(worker.loaded?'worker loaded':'worker online'):'worker offline'}</span></div><div class="gauges"><div><div class="gauge-top"><span>Compute</span><b>${Math.round(g.compute_percent)}%</b></div><div class="track"><div class="fill ${g.compute_percent>90?'hot':''}" style="width:${g.compute_percent}%"></div></div></div><div><div class="gauge-top"><span>VRAM used</span><b>${gib(g.memory_used_mib)}</b></div><div class="track"><div class="fill ${memPct>90?'hot':''}" style="width:${memPct}%"></div></div></div></div><div class="facts"><span><b>${gib(g.memory_free_mib)}</b> free</span><span><b>${Math.round(g.temperature_c)}°C</b></span><span><b>${Math.round(g.power_w)}W</b> / ${Math.round(g.power_limit_w)}W</span></div><div class="section"><div class="section-title">Suites & residents</div>${procs}</div><div class="section"><div class="section-title">Tasks</div>${tasks}</div></article>`}
async function refresh(){try{const r=await fetch('/api/rig',{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error);const gs=d.gpus||[],c=d.capacity||{},hasKnot=d.inventory?.knotext;document.getElementById('grid').innerHTML=gs.map(gpuCard).join('');document.getElementById('gpuCount').textContent=gs.length;document.getElementById('avgCompute').textContent=(gs.reduce((n,g)=>n+g.compute_percent,0)/Math.max(gs.length,1)).toFixed(0)+'%';document.getElementById('freeVram').textContent=gib(c.vram_free_mib);document.getElementById('bestSeat').textContent='GPU '+c.best_gpu;document.getElementById('freeRam').textContent=bytesGiB(c.ram_available_bytes);document.getElementById('freeDisk').textContent=bytesGiB(c.disk_available_bytes);document.getElementById('placementText').innerHTML='<strong>GPU '+c.best_gpu+' has '+gib(c.best_gpu_free_mib)+'</strong> · '+fitLabel(c.best_gpu_free_mib)+' · '+gib(c.vram_free_mib)+' aggregate free, but VRAM is not pooled across cards.';document.getElementById('knotStatus').textContent='Knotext: '+(hasKnot?'detected':'not installed or running');document.getElementById('knotDot').className='dot '+(hasKnot?'':'absent');document.getElementById('health').innerHTML='<span class="dot"></span>'+esc(d.host)+' ONLINE';document.getElementById('stamp').textContent='Updated '+new Date(d.updated_at).toLocaleTimeString();}catch(e){document.getElementById('health').className='error';document.getElementById('health').textContent='TELEMETRY UNAVAILABLE';document.getElementById('stamp').textContent=e.message}}
refresh();setInterval(refresh,3000);
</script></body></html>
