<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/tea/tea.css">
<script src="/tea/tea-shell.js"></script>
<title>Relative Beauty · Jury</title>
<style>
  main{max-width:1440px;margin:auto;padding:28px clamp(16px,3vw,40px) 80px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding:16px 0 24px}.hero h1{font:400 clamp(32px,5vw,56px)/1 var(--serif);margin:0}.mono,.status{font:11px/1.5 var(--mono);letter-spacing:.08em}.status{padding:6px 10px;border:1px solid var(--line);border-radius:999px}.live{color:var(--matcha)}.bad{color:#a63e39}.layout{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.5fr);gap:20px;margin-top:22px}.panel{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:18px}.panel h2{font:400 24px var(--serif);margin:0 0 16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font:10px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--paper-subtle);color:var(--ink)}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:14px}.actions button{padding:9px 14px;border:1px solid var(--ink);border-radius:7px;background:var(--ink);color:var(--paper);cursor:pointer}.jurors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.juror{border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--paper-subtle);cursor:pointer}.juror[open]{grid-column:1/-1}.juror summary{list-style:none}.juror-head{display:flex;justify-content:space-between;gap:12px}.juror h3{margin:0;font:400 19px var(--serif)}.juror .role{color:var(--soft);margin-top:4px}.feedback{white-space:pre-wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font:13px/1.5 var(--serif)}.pipeline{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.pipeline span{border:1px solid var(--line);padding:7px 9px;border-radius:8px;font:10px var(--mono)}.receipt{margin-top:20px}.receipt pre{white-space:pre-wrap;max-height:420px;overflow:auto;font:11px/1.5 var(--mono);background:var(--paper-subtle);padding:12px;border-radius:8px}.notice{margin-top:10px;color:var(--soft)}@media(max-width:850px){.layout{grid-template-columns:1fr}.jurors{grid-template-columns:1fr}.juror[open]{grid-column:auto}}
</style>
<header class="tea-chrome"><a class="tea-brand" href="/"><span class="tea-seal">茶</span><span class="tea-word">Tea</span></a><nav class="tea-nav"><a href="/collections/relative-beauty">Images</a><a href="/jury">Jury</a><a href="/protocol">Protocol</a></nav></header>
<main>
  <section class="hero"><div><div class="mono">LIVE OPERATOR CHAMBER</div><h1>Relative Beauty</h1></div><div id="overall" class="status">connecting</div></section>
  <div class="pipeline"><span>evidence</span><span>→ Pixtral + sensory gates</span><span>→ Governor</span><span>→ Qwen worker</span><span>→ revised instruction</span><span>→ resident FLUX</span><span>→ image</span></div>
  <div class="layout">
    <section class="panel"><h2>Generation</h2><form id="generation"><div class="fields">
      <div class="field wide"><label>Operator anchor</label><textarea name="prompt" rows="4"></textarea></div>
      <div class="field"><label>Width</label><input name="width" type="number" min="64" step="64"></div><div class="field"><label>Height</label><input name="height" type="number" min="64" step="64"></div>
      <div class="field"><label>Steps</label><input name="steps" type="number" min="1" max="100"></div><div class="field"><label>Guidance</label><input name="guidance" type="number" min="0" max="30" step=".1"></div>
      <div class="field"><label>Seed policy</label><select name="seed_policy"><option value="random">Random</option><option value="fixed">Fixed</option></select></div><div class="field"><label>Fixed seed</label><input name="seed" type="number" min="0"></div>
      <div class="field"><label>Worker temperature</label><input name="worker_temperature" type="number" min="0" max="2" step=".05"></div><div class="field"><label>Worker max tokens</label><input name="worker_max_tokens" type="number" min="64" max="4096"></div>
      <div class="field wide"><label><input name="running" type="checkbox"> Run adaptive loop</label></div>
    </div><div class="actions"><button type="submit">Apply generation controls</button></div><div id="saveNotice" class="notice mono"></div></form></section>
    <section class="panel"><h2>Live panel</h2><div id="jurors" class="jurors"></div><div class="receipt"><h2>Latest attributable receipt</h2><pre id="receipt">No verdict yet.</pre></div></section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);let control={};
const identities={
 aesthetic:{name:'Pixtral 12B',role:'Palette, light, medium and atmosphere',gpu:'GPU 2',endpoint:':8110'},
 synthesis:{name:'Governor · Gemma 31B',role:'Evidence synthesis and semantic fidelity',gpu:'GPU 6',endpoint:':8106'},
 structure:{name:'Structural witness',role:'Geometry, anatomy and artifacts',gpu:'Not seated',endpoint:'disabled'},
 siglip:{name:'SigLIP',role:'Fast aesthetic and prompt-adherence gate',gpu:'GPU 3',endpoint:'in-process'},
 dinov2:{name:'DINOv2 Giant',role:'Novelty and semantic-distance gate',gpu:'GPU 3',endpoint:'in-process'},
 worker:{name:'Qwen 3.8 27B worker',role:'Turns evidence into the next instruction',gpu:'GPU 4',endpoint:':8107'}
};
function critiques(receipt,key){const judges=receipt.judges||[];const j=judges.find(x=>x.role===key||x.score_key===key);if(!j)return 'No attributable feedback received.';return JSON.stringify({score:j.score,observations:j.observations,critique:j.critique,latency_ms:j.latency_ms},null,2)}
function card(key,receipt,state){const x=identities[key];let health='idle',fb='No attributable feedback received.';if(key==='worker'){health=state.worker?.status||'unknown';fb=JSON.stringify(state.worker?.last_directive||{},null,2)}else if(key==='siglip'||key==='dinov2'){health=receipt.gates?.tier||'unknown';fb=JSON.stringify(receipt.gates||{},null,2)}else{health=(receipt.judges||[]).some(j=>j.role===key)?'reported':'no report';fb=critiques(receipt,key)}return `<details class="juror"><summary><div class="juror-head"><div><h3>${x.name}</h3><div class="role">${x.role}</div></div><div class="mono">${x.gpu}<br>${x.endpoint}<br>${health}</div></div></summary><div class="feedback">${escapeHTML(fb)}</div></details>`}
function escapeHTML(v){return String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fill(c){const f=$('generation');for(const [k,v] of Object.entries(c)){if(!f.elements[k])continue;if(f.elements[k].type==='checkbox')f.elements[k].checked=!!v;else f.elements[k].value=v??''}}
async function refresh(){try{const r=await fetch('/api/relative-beauty/state',{cache:'no-store'});const d=await r.json();control=d.control||control;fill(control);const receipt=d.jury?.last_receipt||{};const keys=['aesthetic','synthesis','structure','siglip','dinov2','worker'];$('jurors').innerHTML=keys.map(k=>card(k,receipt,d)).join('');$('receipt').textContent=Object.keys(receipt).length?JSON.stringify(receipt,null,2):'No verdict yet.';const ok=d.jury?.station!=='error'&&d.worker?.status!=='error';$('overall').className='status '+(ok?'live':'bad');$('overall').textContent=`jury ${d.jury?.station||'unknown'} · worker ${d.worker?.status||'unknown'}`}catch(e){$('overall').className='status bad';$('overall').textContent='state unavailable'}}
$('generation').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,n={...control};for(const k of ['prompt','seed_policy'])n[k]=f.elements[k].value;for(const k of ['width','height','steps','guidance','seed','worker_temperature','worker_max_tokens'])n[k]=Number(f.elements[k].value);n.running=f.elements.running.checked;const r=await fetch('/api/relative-beauty/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(n)});$('saveNotice').textContent=r.ok?'Applied live.':'Write blocked on this read-only listener; use the operator listener.';if(r.ok)control=n});
refresh();setInterval(refresh,2000);
</script>
