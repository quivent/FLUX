<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>Jury law — Desk</title>
<link rel="stylesheet" href="/tea/tea.css">
<script src="/tea/tea-shell.js"></script>
</head>
<body class="tea-app">
<header class="tea-chrome">
  <a class="tea-brand" href="/"><span class="tea-seal">茶</span><span class="tea-word">Tea</span></a>
  <nav class="tea-nav" aria-label="Tea">
    <a href="/gallery/">Gallery</a>
    <a href="/jury">Jury</a>
    <a href="/judge">Judge</a>
    <a href="/desk">Desk</a>
    <a href="/scores">Scores</a>
    <a href="/movement">Movement</a>
    <a href="/studies">Studies</a>
  </nav>
</header>
<main class="desk">
  <div class="kicker"><a href="/desk">Desk</a> · jury</div>
  <h1>Jury law</h1>
  <p class="lede">How FLUX beauty is judged. Gamma, adversarial rubrics, uniqueness, and sensory gates — each change is written to the live algorithm.</p>
  <div class="desk-lanes">
    <button class="on" data-lane="microgreens">Microgreens · GPU 0</button>
    <button data-lane="fashion">Fashion · GPU 3</button>
    <button data-lane="arcane">Arcane · GPU 0</button>
  </div>
  <div class="desk-status" id="desk-status">loading…</div>
  <div class="stack">
    <label class="toggle">Mode
      <select id="mode">
        <option value="parallel">parallel</option>
        <option value="sequential">sequential</option>
      </select>
    </label>
    <label class="toggle"><input type="checkbox" id="adv"> Adversarial (museum-grade)</label>
    <label class="toggle"><input type="checkbox" id="gates"> Text from sensory gates</label>
    <label class="toggle"><input type="checkbox" id="uniq"> Uniqueness influence</label>
    <label class="toggle"><input type="checkbox" id="triage"> Gate triage</label>
    <label class="toggle">Min judges
      <input type="number" id="minj" min="1" max="3" value="1" style="width:4rem">
    </label>
  </div>
  <div class="stack" style="margin-top:18px" id="gammas"></div>
</main>
<script src="/tea/desk.js"></script>
<script>
  const D = TeaDesk;
  const KEYS = ["pixtral","qwen","decoder","governor"];
  const NAMES = { pixtral: "Beauty γ", qwen: "Structure γ", decoder: "Decoder γ", governor: "Governor γ" };
  let jury = { gamma: {} };
  function payload() {
    KEYS.forEach(k => { const el = D.$("g-"+k); if (el) jury.gamma[k] = el.value / 10; });
    return { jury: {
      mode: D.$("mode").value,
      adversarial: D.$("adv").checked,
      text_from_gates: D.$("gates").checked,
      uniqueness: D.$("uniq").checked,
      gate_triage: D.$("triage").checked,
      min_judges: parseInt(D.$("minj").value, 10) || 1,
      gamma: jury.gamma
    }};
  }
  const push = D.debounce(() => D.save(payload()), 160);
  function drawGamma() {
    D.$("gammas").innerHTML = KEYS.map(k => {
      const g = Number((jury.gamma||{})[k] || 1.5);
      return '<div class="meter"><div class="top"><h3>' + NAMES[k] + '</h3><span class="val" id="gv-' + k + '">' + g.toFixed(1) + 'γ</span></div>'
        + '<input type="range" min="10" max="30" value="' + Math.round(g*10) + '" id="g-' + k + '">'
        + '<div class="hint">Higher γ punishes mid scores. 1.0 is linear.</div></div>';
    }).join("");
    KEYS.forEach(k => {
      D.$("g-"+k).oninput = () => { D.$("gv-"+k).textContent = (D.$("g-"+k).value/10).toFixed(1) + "γ"; push(); };
    });
  }
  ["mode","adv","gates","uniq","triage","minj"].forEach(id => {
    document.addEventListener("change", e => { if (e.target && e.target.id === id) push(); });
  });
  async function paint() {
    const d = await D.load();
    jury = d.desk.jury;
    D.$("mode").value = jury.mode || "parallel";
    D.$("adv").checked = !!jury.adversarial;
    D.$("gates").checked = !!jury.text_from_gates;
    D.$("uniq").checked = !!jury.uniqueness;
    D.$("triage").checked = !!jury.gate_triage;
    D.$("minj").value = jury.min_judges || 1;
    drawGamma();
    D.status("live · " + D.getLane(), "ok");
  }
  D.bindLanes(paint);
  paint().catch(e => D.status(String(e), "bad"));
</script>
</body>
</html>
