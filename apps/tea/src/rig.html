<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12100e">
  <title>Rig Observatory · Tea</title>
  <link rel="stylesheet" href="/tea/tea.css">
  <script src="/tea/tea-shell.js"></script>
  <style>
    :root{--muted:var(--soft);--green:var(--matcha);--hot:var(--vermilion)}
    *{box-sizing:border-box}
    a{color:inherit;text-decoration:none}
    body{font-variant-numeric:tabular-nums}
    main{max-width:1600px;margin:0 auto;padding:28px 34px 72px}
    .mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px;margin-bottom:26px}
    .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-family:var(--mono);line-height:1}
    h1{font:500 56px/.9 var(--serif);margin:8px 0 0;letter-spacing:-.03em}
    .status{text-align:right;font-size:11px;color:var(--muted);font-family:var(--mono);line-height:1.45;padding-bottom:4px}
    .status b{display:block;color:var(--green);font-weight:500}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:7px}
    .summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px}
    .metric{background:var(--paper-soft);padding:14px 16px;min-height:76px;display:flex;flex-direction:column;justify-content:space-between}
    .metric strong{display:block;font:500 22px/1.15 var(--serif);min-height:2.3em}
    .metric span{color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}
    .grid{display:flex;flex-direction:column;gap:16px}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;grid-template-rows:repeat(10,auto)}
    .gpu{display:grid;grid-template-rows:subgrid;grid-row:1/-1;background:linear-gradient(160deg,var(--paper-subtle),var(--paper));border:1px solid var(--line);padding:22px;min-width:0}
    .gpu-head{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px;min-height:18px}
    .gpu-id{font:600 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .badge{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);line-height:1}
    .badge.live{color:var(--green)}
    .work{font:500 26px/1.2 var(--serif);margin:0;min-height:2.4em;display:flex;align-items:flex-end}
    .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;font-size:10px;line-height:1.4;color:var(--green);font-family:var(--mono);min-height:1.4em}
    .meta .dim{color:var(--muted)}
    .brief{margin:0;font-size:13px;line-height:1.5;color:var(--soft);font-family:var(--serif);min-height:4.5em}
    .flux-seat{margin:0;padding:10px 12px;border:1px solid var(--line);background:var(--card-bg);font-family:var(--mono);font-size:11px;line-height:1.4;min-height:3.2em}
    .flux-seat b{color:var(--green);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:9px;display:block;margin-bottom:4px}
    .gauges{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-self:end}
    .gauge-top{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:var(--mono)}
    .gauge-top b{font:500 22px/1 var(--serif);color:var(--ink);letter-spacing:0;text-transform:none}
    .track{height:3px;background:rgba(0,0,0,.18)}
    body.mode-nocturnal .track{background:rgba(255,255,255,.08)}
    .fill{height:100%;background:var(--matcha)}
    .fill.hot{background:linear-gradient(90deg,var(--gold),var(--hot))}
    .stack{display:flex;height:8px;background:rgba(0,0,0,.12);overflow:hidden;align-self:end}
    .stack i{display:block;height:100%;flex:0 0 auto}
    .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:10px;color:var(--muted);font-family:var(--mono);padding:0;border:0;align-self:end}
    .facts b{color:var(--ink);font-weight:500}
    .occ-wrap{min-height:9.5em}
    .occ{width:100%;border-collapse:collapse;table-layout:fixed}
    .occ th,.occ td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
    .occ th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:0}
    .occ col.s{width:108px}.occ col.v{width:88px}
    .occ td.suite{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .occ td.model{color:var(--ink);font-size:12px}
    .occ td.model small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .occ td.vram{font-family:var(--mono);font-size:11px;white-space:nowrap;text-align:right;padding-right:0}
    .occ td.vram small{display:block;color:var(--muted);margin-top:2px}
    .jobs{display:flex;flex-direction:column;gap:6px;min-height:3.2em;align-self:end}
    .job{display:grid;grid-template-columns:84px 48px 1fr;gap:10px;align-items:baseline;font-size:10px;color:var(--muted);font-family:var(--mono)}
    .job b{color:var(--green);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
    .job span{color:var(--ink);text-align:right}
    .job em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quiet{color:var(--faint);font-size:10px;font-family:var(--mono);margin:0}
    @media(max-width:1100px){
      .summary{grid-template-columns:repeat(3,minmax(0,1fr))}
      .pair{grid-template-columns:1fr;grid-template-rows:none}
      .gpu{display:flex;flex-direction:column;gap:12px;grid-row:auto}
      .work,.brief,.occ-wrap,.jobs,.meta,.flux-seat{min-height:0}
      main{padding-left:18px;padding-right:18px}
      h1{font-size:42px}
    }
  </style>
</head>
<body class="mode-nocturnal">
  <main>
    <div class="mast">
      <div>
        <div class="eyebrow">Observatory</div>
        <h1>The rig</h1>
        <p class="deck" style="margin:10px 0 0;max-width:54ch;color:var(--muted);font-size:14px"><a href="/rig/compare.html">FP8 vs BF16 fashion</a> — same brief, side by side.</p>
      </div>
      <div class="status"><b id="health">probing…</b><span id="stamp"></span></div>
    </div>
    <section class="summary">
      <div class="metric"><strong id="gpuCount">—</strong><span>GPU seats</span></div>
      <div class="metric"><strong id="avgCompute">—</strong><span>compute</span></div>
      <div class="metric"><strong id="freeVram">—</strong><span>VRAM free</span></div>
      <div class="metric"><strong id="fluxSeats">—</strong><span>FLUX seats</span></div>
      <div class="metric"><strong id="freeRam">—</strong><span>RAM free</span></div>
      <div class="metric"><strong id="freeDisk">—</strong><span>disk free</span></div>
    </section>
    <section class="grid" id="grid"></section>
  </main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gib=m=>(Number(m||0)/1024).toFixed(1)+' GiB';
const bytesGiB=b=>(Number(b||0)/1073741824).toFixed(0)+' GiB';
const COLORS=['#7d9b6a','#c4a35a','#c45c3e','#6a8aa8','#9a7bb0','#8a7a5a'];
function argAfter(cmd, flag){
  const f=String(cmd||'').split(/\s+/);
  const i=f.indexOf(flag);
  return i>=0 && i+1<f.length ? f[i+1] : '';
}
function occupantFromProc(p){
  const cmd=p.command||'';
  let model=p.model||'', precision=p.precision||'', path=p.path||'';
  if(!model || !precision){
    if(/worker\.py/.test(cmd)){
      path=argAfter(cmd,'--fp8-transformer')||argAfter(cmd,'--model-dir')||path;
      model=model||'FLUX.1-dev';
      precision=precision||(/--fp8-transformer/.test(cmd)?'FP8':'BF16');
    }else if(/vllm/i.test(cmd)){
      path=path||argAfter(cmd,'--model');
      const served=argAfter(cmd,'--served-model-name');
      const base=(path||'').replace(/\/+$/,'').split('/').pop();
      model=model||(served&&base&&served!==base?served+' · '+base:(served||base||p.task||''));
      if(!precision){
        if(/awq/i.test(cmd)) precision='AWQ';
        else if(/fp8/i.test(cmd)) precision='FP8';
        else if(/fp4|nvfp4/i.test(cmd)) precision='FP4';
      }
    }else if(/moj_evaluator/.test(cmd)){
      model=model||'MoJ visual jury';
    }
  }
  return {
    suite:p.suite||'CUDA process',
    task:p.task||'',
    model:model||p.task||p.name||'unknown',
    precision,
    path,
    memory_mib:Number(p.memory_mib||0),
    pid:p.pid
  };
}
function occupantsOf(g){
  if(Array.isArray(g.occupants)&&g.occupants.length){
    return g.occupants.map(o=>({
      suite:o.suite||'CUDA process', task:o.task||'', model:o.model||o.task||'',
      precision:o.precision||'', path:o.path||'', memory_mib:Number(o.memory_mib||0), pid:o.pid
    }));
  }
  return (g.processes||[]).map(occupantFromProc);
}
function fluxOf(g){
  if(g.flux&&g.flux.present!==false&&(g.flux.model||g.flux.precision)) return g.flux;
  return occupantsOf(g).find(o=>/FLUX/i.test(o.suite||''))||null;
}
function gpuCard(g){
  const occ=occupantsOf(g);
  const flux=fluxOf(g);
  const memPct=g.memory_total_mib?g.memory_used_mib/g.memory_total_mib*100:0;
  const worker=g.worker||{};
  const badge=flux||worker.loaded?'FLUX '+(flux&&flux.precision||worker.precision||'loaded'):(worker.up?'worker up':(occ.length?'occupied':'empty'));
  const jobs=(g.tasks||[]).map(t=>{
    const steps=t.atlas_total?`${t.atlas_done||0}/${t.atlas_total}`:`${t.step||0}/${t.total_steps||0}`;
    return `<div class="job"><b>${esc(t.status)}</b><span>${esc(steps)}</span><em>${esc(t.kind||'job')}</em></div>`;
  }).join('');
  const meta=[];
  if(g.detail) meta.push(`<span>${esc(g.detail)}</span>`);
  if(g.wall) meta.push(`<span class="dim">${esc(g.wall)}</span>`);
  const stack=occ.map((o,i)=>{
    const pct=g.memory_total_mib?Math.max(1, o.memory_mib/g.memory_total_mib*100):0;
    return `<i title="${esc(o.suite)} ${esc(o.model)} ${gib(o.memory_mib)}" style="width:${pct}%;background:${COLORS[i%COLORS.length]}"></i>`;
  }).join('');
  const rows=occ.map(o=>{
    const prec=o.precision?` · ${esc(o.precision)}`:'';
    const path=o.path?`<small>${esc(o.path)}</small>`:'';
    const pct=g.memory_total_mib?(o.memory_mib/g.memory_total_mib*100).toFixed(0)+'%':'';
    return `<tr>
      <td class="suite">${esc(o.suite)}</td>
      <td class="model">${esc(o.model)}${prec}${path}</td>
      <td class="vram">${gib(o.memory_mib)}<small>${pct} of card</small></td>
    </tr>`;
  }).join('');
  const fluxBlock=flux
    ? `<div class="flux-seat"><b>FLUX on this card</b>${esc(flux.model||'FLUX.1-dev')} · ${esc(flux.precision||'')} · ${gib(flux.memory_mib||0)} · ${esc(flux.socket||('flux-gpu'+g.index+'.sock'))}</div>`
    : `<div class="flux-seat"><b>FLUX on this card</b>none — this seat is not a FLUX worker</div>`;
  return `<article class="gpu">
    <div class="gpu-head"><div class="gpu-id">GPU ${g.index} · ${esc((g.name||'').replace('NVIDIA ',''))}</div><span class="badge ${flux||worker.loaded?'live':''}">${badge}</span></div>
    <h2 class="work">${esc(g.performing||'Unknown')}</h2>
    <div class="meta">${meta.join('')||'&nbsp;'}</div>
    <p class="brief">${g.brief?esc(g.brief):''}</p>
    ${fluxBlock}
    <div class="gauges">
      <div><div class="gauge-top"><span>Compute</span><b>${Math.round(g.compute_percent)}%</b></div><div class="track"><div class="fill ${g.compute_percent>90?'hot':''}" style="width:${g.compute_percent}%"></div></div></div>
      <div><div class="gauge-top"><span>VRAM</span><b>${gib(g.memory_used_mib)} / ${gib(g.memory_total_mib)}</b></div><div class="track"><div class="fill ${memPct>90?'hot':''}" style="width:${memPct}%"></div></div></div>
    </div>
    <div class="stack">${stack}</div>
    <div class="facts"><span><b>${gib(g.memory_free_mib)}</b> free</span><span><b>${Math.round(g.temperature_c)}°C</b></span><span><b>${Math.round(g.power_w)} W</b></span></div>
    <div class="occ-wrap">${rows?`<table class="occ"><colgroup><col class="s"><col><col class="v"></colgroup><thead><tr><th>Suite</th><th>Model</th><th>VRAM</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="quiet">No CUDA occupants reported.</p>'}</div>
    <div class="jobs">${jobs||''}</div>
  </article>`;
}
function pairCards(gs){
  const out=[];
  for(let i=0;i<gs.length;i+=2){
    out.push(`<div class="pair">${gpuCard(gs[i])}${gs[i+1]?gpuCard(gs[i+1]):'<article class="gpu"></article>'}</div>`);
  }
  return out.join('');
}
function applyRig(d){
  if(!d||d.ok===false) throw Error((d&&d.error)||'bad snapshot');
  const gs=d.gpus||[], c=d.capacity||{};
  document.getElementById('grid').innerHTML=pairCards(gs);
  document.getElementById('gpuCount').textContent=gs.length;
  document.getElementById('avgCompute').textContent=(gs.reduce((n,g)=>n+g.compute_percent,0)/Math.max(gs.length,1)).toFixed(0)+'%';
  document.getElementById('freeVram').textContent=gib(c.vram_free_mib);
  const flux=gs.map(g=>{
    const f=fluxOf(g);
    return f?('GPU '+g.index+' '+(f.precision||'')).trim():null;
  }).filter(Boolean);
  document.getElementById('fluxSeats').textContent=flux.length?flux.join(' · ').replace(/GPU /g,''):'none';
  document.getElementById('freeRam').textContent=bytesGiB(c.ram_available_bytes);
  document.getElementById('freeDisk').textContent=bytesGiB(c.disk_available_bytes);
  document.getElementById('health').innerHTML='<span class="dot"></span>'+esc(d.host)+' live';
  document.getElementById('stamp').textContent='Updated '+new Date(d.updated_at).toLocaleTimeString();
}
function connectRig(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/rig/ws';
  let retries=0;
  const open=()=>{
    const ws=new WebSocket(url);
    ws.onopen=()=>{retries=0};
    ws.onmessage=e=>{
      try{ applyRig(JSON.parse(e.data)); }
      catch(err){
        document.getElementById('health').textContent='telemetry unavailable';
        document.getElementById('stamp').textContent=err.message;
      }
    };
    ws.onerror=()=>ws.close();
    ws.onclose=()=>{
      document.getElementById('health').textContent='reconnecting';
      const delay=Math.min(1000*2**retries,8000)+Math.random()*200;
      retries++;
      setTimeout(open, delay);
    };
  };
  open();
}
connectRig();
</script>
</body>
</html>
